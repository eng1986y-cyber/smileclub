<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<title>관리자 페이지</title>

<style>

.ad-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.ad-title{
  font-size:20px;
  font-weight:bold;
}

.add-btn{
  height:32px;
  padding:0 14px;
  background:#4CAF50;
  border-radius:6px;
}

.add-btn:hover{
  background:#3da444;
}

.admin-buttons button{
  width:100px;
}

#boardAdminList{
  max-height:800px;
  overflow:auto;
}

.board-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  margin-bottom:60px;
  align-items:flex-start;
}

html,body{
  height:100%;
}

body.login-mode{
  overflow:hidden;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial;
  background:#f5f5f5;
}

h2{
  margin-top:0;
}

input{
  width:99.8%;
  height:36px;
  margin-bottom:6px;
  padding:0 8px;
  box-sizing:border-box;
}

button{
  height:36px;
  padding:0 12px;
  border:none;
  background:#87CEEB;
  color:#fff;
  cursor:pointer;
  border-radius:6px;
}

button:hover{ background:#6bbfe0; }

.section{
  margin:40px 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.card{
  background:#fff;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  cursor:grab;
  position:relative;
}

/* 게시판 카드 간격 */
#boardAdminList .card{
  margin-bottom:10px;
}

#boardAdminList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.delete-btn{
  position:absolute;
  top:6px;
  right:6px;
  background:#ff5c5c;
  height:24px;
  font-size:12px;
}



.admin-container{

  margin:0 auto;
}

@media (max-width:1400px){
  .admin-container{
    width:100%;
    padding:0 20px;
  }
}

.top-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.board-content{
  flex:1;
  overflow:auto;
}

.board-box{
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  min-height:520px;
  display:flex;
  flex-direction:column;
}

.board-box input,
.board-box textarea{
  width:100%;
  box-sizing:border-box;
}

.edit-btn{
  position:absolute;
  top:6px;
  right:60px;
  height:24px;
  font-size:12px;
  background:#4CAF50;
}

/* 게시판 페이지 버튼 */
#boardPagination button{
  background:white;
  color:#333;
  border:1px solid #ddd;
  margin:0 3px;
}

/* 현재 페이지 */
#boardPagination button.active{
  background:#87CEEB;
  color:white;
}

.admin-buttons{
  position:fixed;
  left:50%;
  margin-left:720px;   /* 사이트폭(1400px) 기준 오른쪽 */
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:5px;
  z-index:999;
}

.top-btn{
  height:40px;
  background:#e5e5e5;
  color:#333;
}

.admin-main{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.admin-scroll{
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-top:15px;
}

#boardPagination{
  margin-top:10px;
  margin-bottom:40px;
  text-align:center;
}

.board-box:last-child{
  margin-bottom:40px;
}

#visitStats{
  display:flex;
  flex-wrap:nowrap;
  overflow:hidden;
  white-space:nowrap;
}

#visitStats div::after{
  content:"|";
  margin:0 10px;
}

#visitStats div:last-child::after{
  content:"";
}

.search-with-logo{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-logo{
  height:36px;
  width:auto;
  border-radius:6px;
}

.search-with-logo input[type="text"]{
  flex:1;
  margin-bottom:0;
}

#siteDescriptionInput{
  margin:0;
  resize:vertical;
}

textarea{
  width:99.8%;
  margin-bottom:6px;
  padding:8px;
  box-sizing:border-box;

}

/* 관리자 정방형 슬라이드 */

.admin-square-slider{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-square-wrapper{
  overflow:hidden;
  width:100%;
}

#squareAdmin{
  display:flex;
  transition:transform .35s ease;

}

/* 한 페이지 */

.square-page{
  min-width:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  box-sizing:border-box;
}

/* 카드 높이 */

.square-page .card{
  min-height:210px;
}

/* 버튼 */

.simple-slide-btn{
  width:34px;
  height:34px;
  background:#e5e5e5;
  color:#333;
  border:none;
  border-radius:6px;
  font-size:14px;
  flex-shrink:0;
}

.simple-slide-btn:hover{
  background:#d5d5d5;
}

/* 태블릿 */

@media (max-width:1200px){

  .square-page{
    grid-template-columns:repeat(4,1fr);
  }

}

/* 모바일 */

@media (max-width:768px){

  .square-page{
    grid-template-columns:repeat(2,1fr);
  }

<script>

const imageAdmin=document.getElementById("imageAdmin");
const textAdmin=document.getElementById("textAdmin");
const squareAdmin=document.getElementById("squareAdmin");
const snsVideoAdmin=document.getElementById("snsVideoAdmin");

const bannerImg=document.getElementById("bannerImg");
const bannerLink=document.getElementById("bannerLink");

const ownerNameInput=document.getElementById("ownerNameInput");
const ownerInstagram=document.getElementById("ownerInstagram");
const ownerYoutube=document.getElementById("ownerYoutube");
const ownerBlog=document.getElementById("ownerBlog");

let dragItem=null;

async function adminLogin(){

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert("로그인 실패: " + error.message);
    return;
  }

  document.getElementById("loginPage").style.display="none";
  document.getElementById("adminPage").style.display="block";

  document.body.classList.remove("login-mode");

  try{
    await loadData();
    await loadBoardData();
    await loadVisitStats();
    await loadOrders();
  }catch(e){
    console.error("로그인 후 로딩 에러:", e);
  }
}

/* ================= 공통 카드 생성 ================= */

function createCard(innerHTML){
  const div=document.createElement("div");
  div.className="card";
  div.draggable=true;
  div.innerHTML=`
    <button class="delete-btn" onclick="deleteAd(this)">삭제</button>
    ${innerHTML}
  `;

  div.addEventListener("dragstart",()=>dragItem=div);
  div.addEventListener("dragover",e=>e.preventDefault());
  div.addEventListener("drop",function(){
    if(dragItem!==div){
      div.parentNode.insertBefore(dragItem,div.nextSibling);
    }
  });

  return div;
}

/* ================= 추가 ================= */

function addImageAd(main="", img="", link="", video=""){
  imageAdmin.appendChild(
    createCard(`
      <input value="${main}" placeholder="메인 명칭">

      <input value="${img}" placeholder="이미지 URL">

      <input type="file" accept="image/*"
        onchange="uploadImage(this)">

      <input value="${link}" placeholder="클릭 링크">

      <input value="${video}"
placeholder="유튜브 영상 링크"
oninput="validateYoutube(this)">
    `)
  );
}

function addTextAd(title="",link=""){
  textAdmin.appendChild(
    createCard(`
      <input value="${title}" placeholder="광고 제목">
      <input value="${link}" placeholder="클릭 링크">
    `)
  );
}

function addSquareAd(
  main="",
  img="",
  link="",
  video="",
  detail=""
){

  const card = createCard(`
      <input value="${main}" placeholder="메인 명칭">

      <input value="${img}" placeholder="이미지 URL">

      <input type="file" accept="image/*"
        onchange="uploadImage(this)">

      <input value="${link}" placeholder="클릭 링크">

      <input value="${video}" placeholder="결제QR코드 링크">

      <input value="${detail}" placeholder="상품상세 이미지 링크">
  `);

  const oldCards =
    [...squareAdmin.querySelectorAll(".card")];

  const allCards = [card, ...oldCards];

  rebuildSquarePages(allCards);

}

function rebuildSquarePages(cards = null){

  if(!cards){
    cards = [...squareAdmin.querySelectorAll(".card")];
  }

  squareAdmin.innerHTML = "";

  const pageSize = 18;

  for(let i=0; i<cards.length; i+=pageSize){

    const page = document.createElement("div");
    page.className = "square-page";

    cards.slice(i, i+pageSize).forEach(card=>{
      page.appendChild(card);
    });

    squareAdmin.appendChild(page);

  }

  adminSquarePage = 0;

  squareAdmin.style.transform = "translateX(0)";
}

function addSnsVideo(title="", thumb="", video="", link=""){
  snsVideoAdmin.appendChild(
createCard(`
  <input value="${title}" placeholder="영상 제목">

  <input value="${thumb}" placeholder="썸네일 이미지 URL">

  <input type="file" accept="image/*"
    onchange="uploadImage(this)">

  <input value="${video}"
placeholder="유튜브 영상 링크"
oninput="validateYoutube(this)">

  <input value="${link}" placeholder="클릭 링크">
`)
  );
}

/* ================= 불러오기 ================= */

async function loadData(){

imageAdmin.innerHTML="";
textAdmin.innerHTML="";
squareAdmin.innerHTML="";
snsVideoAdmin.innerHTML="";

const { data: ads } = await supabaseClient

async function loadBoardData(){

  const { data } = await supabaseClient

/* 게시판 출력 */

function escapeHTML(str){

  if(!str) return "";

  return str
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;");

}

function renderBoard(){

  boardAdminList.innerHTML="";

  const start = (currentPage-1)*rowsPerPage;
  const end = start+rowsPerPage;

  const pageItems = boardData.slice(start,end);

  pageItems.forEach(post=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
<button class="delete-btn"
onclick="deleteBoardPost(${post.id})">삭제</button>

<button class="edit-btn"
onclick="editBoardPost(${post.id})">
수정
</button>

<div style="font-size:12px;color:#888;margin-bottom:4px;">
[${escapeHTML(post.category || "일반")}]
</div>

<strong>${escapeHTML(post.title)}</strong>
    `;

    boardAdminList.appendChild(div);

  });

  renderPagination();

}

/* 페이지 버튼 */

function renderPagination(){

  boardPagination.innerHTML="";

  const totalPages=Math.ceil(boardData.length/rowsPerPage);

  let startPage=Math.floor((currentPage-1)/maxPageButtons)*maxPageButtons+1;
  let endPage=Math.min(startPage+maxPageButtons-1,totalPages);

  if(currentPage>1){

    const prev=document.createElement("button");
    prev.textContent="◀";

    prev.onclick=()=>{
      currentPage--;
      renderBoard();
    };

    boardPagination.appendChild(prev);

  }

  for(let i=startPage;i<=endPage;i++){

    const btn=document.createElement("button");
    btn.textContent=i;

if(i===currentPage){
  btn.classList.add("active");
}

    btn.onclick=()=>{
      currentPage=i;
      renderBoard();
    };

    boardPagination.appendChild(btn);

  }

  if(currentPage<totalPages){

    const next=document.createElement("button");
    next.textContent="▶";

    next.onclick=()=>{
      currentPage++;
      renderBoard();
    };

    boardPagination.appendChild(next);

  }

}

async function uploadImage(input){

  const file = input.files[0];
  if(!file) return;

const safeName = file.name.replace(/\s+/g,"_");
const fileName = crypto.randomUUID()+"_"+safeName;

  const { data, error } = await supabaseClient
    .storage
    .from("yb365")
    .upload(fileName, file);

  if(error){
    alert("업로드 실패");
    return;
  }

  const { data: urlData } = supabaseClient
    .storage
    .from("yb365")
    .getPublicUrl(fileName);

  const imageUrl = urlData.publicUrl;

  const urlInput = input.parentElement.querySelectorAll("input")[1];
  urlInput.value = imageUrl;

  alert("업로드 완료 ✅");
}

async function loadVisitStats(){

  const today = new Date();
  const startDate = new Date();
  startDate.setDate(today.getDate() - 29);   // 오늘 포함 최근 30일

  const start = startDate.toISOString().split("T")[0];
  const todayStr = today.toISOString().split("T")[0];

  const { data } = await supabaseClient
    .from("site_visits")
    .select("*")
    .gte("date", start)
    .lte("date", todayStr)
    .order("date", { ascending: false });

  if(!data) return;

  let total = 0;
  let todayCount = 0;

  const labels = [];
  const counts = [];

  data.forEach(row => {

    total += row.count;

    if(row.date === todayStr){
      todayCount = row.count;
    }

    labels.push(row.date.slice(5)); // MM-DD
    counts.push(row.count);

  });

  document.getElementById("todayVisit").textContent = todayCount;
  document.getElementById("totalVisit").textContent = total;

  const ctx = document.getElementById("visitChart");

  if(window.visitChartInstance){
    window.visitChartInstance.destroy();
  }

  window.visitChartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        data: counts,
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      plugins:{ legend:{ display:false }},
      scales:{ y:{ display:false }}
    }
  });
}

function slideAdminSquare(direction){

    squareAdmin.querySelectorAll(".square-page").length;

  adminSquarePage += direction;

    adminSquarePage = 0;
  }

  if(adminSquarePage >= totalPages){
    adminSquarePage = totalPages - 1;
  }

  squareAdmin.style.transform =
    `translateX(-${adminSquarePage * pageWidth}px)`;

}

            결제대기

          </option>


          <option value="구매완료"
            ${order.status === "구매완료"
              ? "selected"
              : ""}>

            구매완료

          </option>


          <option value="배송중"
            ${order.status === "배송중"
              ? "selected"
              : ""}>

            배송중

          </option>


          <option value="배송완료"
            ${order.status === "배송완료"
              ? "selected"
              : ""}>

            배송완료

          </option>


          <option value="주문취소"
            ${order.status === "주문취소"
              ? "selected"
              : ""}>

            주문취소

          </option>


        </select>


        <input
          id="orderEstimate_${order.id}"
          class="order-estimate-input"
          type="number"
          placeholder="최종 견적금액"
          value="${order.estimate_price || ""}">


        <textarea
          id="orderMemo_${order.id}"
          class="order-memo-input"
          placeholder="관리자 메모">${escapeOrderHTML(
            order.admin_memo || ""
          )}</textarea>


        <button
          class="order-save-btn"
          onclick="saveOrder(${order.id})">

          주문정보 저장

        </button>


        <button
          class="order-delete-btn"
          onclick="deleteOrder(${order.id})">

          주문 삭제

        </button>


      </div>

    `;


    list.appendChild(card);

  });

}


/* 주문 상세 열기 */

function toggleOrderDetail(id){

  const box =
    document.getElementById(
      "orderDetail_" + id
    );


  if(!box) return;


  box.classList.toggle("show");

}


/* 주문정보 저장 */

async function saveOrder(id){

  const status =
    document.getElementById(
      "orderStatus_" + id
    ).value;


  const estimate =
    document.getElementById(
      "orderEstimate_" + id
    ).value;


  const memo =
    document.getElementById(
      "orderMemo_" + id
    ).value.trim();


  const { error } =

    await supabaseClient

      .from("orders")

      .update({

        status:status,

        estimate_price:
          estimate
          ? Number(estimate)
          : 0,

        admin_memo:memo

      })

      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "주문정보 저장 실패\n\n" +
      error.message
    );

    return;

  }


  alert("주문정보가 저장되었습니다.");

  await loadOrders();

}


/* 주문 삭제 */

async function deleteOrder(id){

  if(!confirm(
    "이 주문을 정말 삭제하시겠습니까?"
  )){

    return;

  }


  const { error } =

    await supabaseClient

      .from("orders")

      .delete()

      .eq("id",id);


  if(error){

    alert(
      "주문 삭제 실패\n\n" +
      error.message
    );

    return;

  }


  alert("주문이 삭제되었습니다.");

  await loadOrders();

}


/* HTML 문자 보호 */

function escapeOrderHTML(value){

  if(value === null || value === undefined){

    return "";

  }


  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* URL 보호 */

function escapeOrderURL(value){

  if(!value){

    return "#";

  }


  try{

    const url =
      new URL(value);


    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){

      return "#";

    }


    return escapeOrderHTML(
      url.href
    );

  }catch(e){

    return "#";

  }

}
