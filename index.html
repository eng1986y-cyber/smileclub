<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광고 사이트</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  margin:0;
  padding:30px;
  font-family:Arial;
  background:#f6f6f6;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

#search{
  width:300px;
  height:38px;
  display:block;
  margin:0 auto 30px auto;
  padding:0 10px;
  border-radius:6px;
  border:1px solid #ccc;
}

#ads-container{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:15px;
}

.card{
  background:white;
  padding:10px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  border-radius:8px;
  cursor:pointer;
}

@media(max-width:768px){
  #ads-container{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>
<body>

<h1>광고 목록</h1>
<input type="text" id="search" placeholder="제목 검색">

<div id="ads-container"></div>

<script>
const SUPABASE_URL = "https://fmipichgotqjsxrddcie.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtaXBpY2hnb3RxanN4cmRkY2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxOTUyMjYsImV4cCI6MjA4Nzc3MTIyNn0.sgn-16IIC4_oD-uoe5-CVKHlSTHS98S9jcZoAaeBvWc";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const container = document.getElementById("ads-container");
const searchInput = document.getElementById("search");

async function loadAds(keyword=""){
  let query = supabaseClient
    .from("ads")
    .select("*")
    .order("created_at",{ascending:false});

  if(keyword){
    query = query.ilike("title", `%${keyword}%`);
  }

  const { data, error } = await query;
  if(error){ alert(error.message); return; }

  container.innerHTML="";

  data.forEach(ad=>{
    const div=document.createElement("div");
    div.className="card";

    if(ad.type==="image"){
      div.innerHTML=`
        <h3>${ad.title||""}</h3>
        <img src="${ad.image}" onclick="window.open('${ad.link||"#"}','_blank')">
      `;
    }else{
      div.innerHTML=`
        <h3>${ad.title||""}</h3>
        <p>${ad.content||""}</p>
      `;
    }

    container.appendChild(div);
  });
}

searchInput.addEventListener("input",(e)=>{
  loadAds(e.target.value);
});

loadAds();
</script>

</body>
</html>
