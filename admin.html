<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 페이지</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  margin:0;
  padding:30px;
  font-family:Arial;
  background:#f5f5f5;
}

h1{
  margin-bottom:20px;
}

input, textarea, select{
  width:400px;
  height:38px;
  margin-bottom:10px;
  padding:5px 10px;
  border-radius:6px;
  border:1px solid #ccc;
  display:block;
}

textarea{
  height:80px;
}

button{
  width:150px;
  height:40px;
  background:#222;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

#ad-list{
  margin-top:40px;
}

.item{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
}
</style>
</head>
<body>

<h1>광고 관리자</h1>

<select id="type">
  <option value="image">이미지 광고</option>
  <option value="text">텍스트 광고</option>
</select>

<input type="text" id="title" placeholder="제목">
<textarea id="content" placeholder="텍스트 광고 내용"></textarea>
<input type="file" id="image">
<input type="text" id="link" placeholder="이동 링크">

<button onclick="addAd()">광고 추가</button>

<div id="ad-list"></div>

<script>
const SUPABASE_URL = "https://fmipichgotqjsxrddcie.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtaXBpY2hnb3RxanN4cmRkY2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxOTUyMjYsImV4cCI6MjA4Nzc3MTIyNn0.sgn-16IIC4_oD-uoe5-CVKHlSTHS98S9jcZoAaeBvWc";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function addAd(){
  const type=document.getElementById("type").value;
  const title=document.getElementById("title").value;
  const content=document.getElementById("content").value;
  const link=document.getElementById("link").value;
  const imageFile=document.getElementById("image").files[0];

  let imageUrl=null;

  if(type==="image" && imageFile){
    const fileName=Date.now()+"-"+imageFile.name;

    const { error:uploadError } = await supabaseClient
      .storage
      .from("ads-image")
      .upload(fileName,imageFile);

    if(uploadError){ alert(uploadError.message); return; }

    const { data } = supabaseClient
      .storage
      .from("ads-image")
      .getPublicUrl(fileName);

    imageUrl=data.publicUrl;
  }

  const { error } = await supabaseClient
    .from("ads")
    .insert([{ type,title,content,image:imageUrl,link }]);

  if(error){ alert(error.message); return; }

  alert("저장 완료");
  location.reload();
}

async function loadAds(){
  const { data,error } = await supabaseClient
    .from("ads")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){ alert(error.message); return; }

  const list=document.getElementById("ad-list");
  list.innerHTML="";

  data.forEach(ad=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <b>${ad.title}</b>
      <button onclick="deleteAd('${ad.id}')">삭제</button>
    `;
    list.appendChild(div);
  });
}

async function deleteAd(id){
  await supabaseClient.from("ads").delete().eq("id",id);
  location.reload();
}

loadAds();
</script>

</body>
</html>
